<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X Planner — New project or habit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:#F0B445}a:hover{color:#F6C76B}
input::placeholder{color:#80868E}
</style>
</helmet>
<div style="width: 440px; height: 960px; box-sizing: border-box; background: #141619; color: #E9EAEC; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; border: 1px solid #2A2E34; border-radius: 12px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 20px; border-bottom: 1px solid #22262B">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A0A6AD">NEW PROJECT OR HABIT</div>
    <a href="Main.dc.html" aria-label="Close" title="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A0A6AD; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </a>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 22px 24px 20px">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="proj-name" style="font-size: 13px; color: #A0A6AD">Name</label>
      <input id="proj-name" type="text" value="{{name}}" onChange="{{onName}}" placeholder="e.g. Meditation" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #1C1F23; border: 1px solid #2A2E34; border-radius: 8px; color: #E9EAEC; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px">
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; color: #A0A6AD; padding: 0; margin-bottom: 8px">Does it need daily planning?</legend>
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
        <label style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: {{k.bg}}; border: 1px solid {{k.ring}}; border-radius: 10px; cursor: pointer">
          <input type="radio" name="proj-kind" checked="{{k.checked}}" onChange="{{k.pick}}" style="width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: {{k.accent}}">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">{{k.title}}</span>
            <span style="font-size: 13px; line-height: 1.4; color: #A0A6AD">{{k.desc}}</span>
          </span>
        </label>
      </sc-for>
      <div style="font-size: 12px; color: #A0A6AD">You can switch this later in the project's settings.</div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="proj-min" style="font-size: 13px; color: #A0A6AD">Minimum to earn an X</label>
      <input id="proj-min" type="text" value="{{min}}" onChange="{{onMin}}" placeholder="e.g. 10 minutes" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #1C1F23; border: 1px solid #2A2E34; border-radius: 8px; color: #E9EAEC; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px">
      <div style="font-size: 12px; line-height: 1.45; color: #A0A6AD">Keep it small enough that you can do it on a bad day.</div>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; color: #A0A6AD; padding: 0; margin-bottom: 8px">Color</legend>
      <div style="display: flex; gap: 10px">
        <sc-for list="{{colors}}" as="c" hint-placeholder-count="4">
          <label title="{{c.label}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; border: 2px solid {{c.ring}}; cursor: pointer">
            <input type="radio" name="proj-color" aria-label="{{c.label}}" checked="{{c.checked}}" onChange="{{c.pick}}" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
            <span style="width: 26px; height: 26px; border-radius: 13px; background: {{c.color}}"></span>
          </label>
        </sc-for>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; color: #A0A6AD; padding: 0; margin-bottom: 8px">Start the card</legend>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{starts}}" as="st" hint-placeholder-count="2">
          <label style="flex: 1; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #1C1F23; border: 1px solid {{st.ring}}; border-radius: 8px; cursor: pointer; font-size: 14px">
            <input type="radio" name="proj-start" checked="{{st.checked}}" onChange="{{st.pick}}" style="width: 16px; height: 16px; margin: 0; accent-color: {{st.accent}}">
            {{st.label}}
          </label>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; gap: 16px; align-items: center; padding: 16px; background: #1C1F23; border: 1px solid #2A2E34; border-radius: 10px">
      <div style="width: 112px; flex: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px">
        <sc-for list="{{preview}}" as="pc" hint-placeholder-count="49">
          <sc-if value="{{pc.first}}" hint-placeholder-val="{{false}}">
            <div style="aspect-ratio: 1 / 1; box-sizing: border-box; border-radius: 3px; border: 1.5px solid {{pc.accent}}"></div>
          </sc-if>
          <sc-if value="{{pc.rest}}" hint-placeholder-val="{{true}}">
            <div style="aspect-ratio: 1 / 1; border-radius: 3px; background: #24282D"></div>
          </sc-if>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>
          <span style="font-size: 15px; font-weight: 600">{{displayName}}</span>
        </div>
        <div style="font-size: 12px; color: #A0A6AD">{{kindLine}}</div>
        <div style="font-size: 12px; color: #A0A6AD">{{minLine}}</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A0A6AD">49 days · {{startLine}}</div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 10px; padding: 14px 16px 16px; border-top: 1px solid #22262B">
    <a href="Main.dc.html" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #2A2E34; color: #E9EAEC; font-size: 14px; font-weight: 500; text-decoration: none">Cancel</a>
    <a href="Main.dc.html" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{accent}}; color: {{ink}}; font-size: 14px; font-weight: 600; text-decoration: none">{{createLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":960}}'>
class Component extends DCLogic {
  state = { name: 'Meditation', min: '10 minutes', kind: 'habit', color: 'rose', start: 'today' };

  renderVals() {
    const s = this.state;
    const defs = [
      { id: 'amber', label: 'Amber', color: '#F0B445', ink: '#1A1405', bg: '#1F1C15' },
      { id: 'green', label: 'Green', color: '#7CC48A', ink: '#0D1A10', bg: '#18201A' },
      { id: 'blue', label: 'Blue', color: '#7FB0E0', ink: '#0C1520', bg: '#171D24' },
      { id: 'rose', label: 'Rose', color: '#E58FA0', ink: '#1E0C10', bg: '#221A1C' }
    ];
    const cur = defs.find((d) => d.id === s.color) || defs[0];
    const colors = defs.map((d) => ({
      label: d.label,
      color: d.color,
      checked: d.id === s.color,
      ring: d.id === s.color ? d.color : 'transparent',
      pick: () => this.setState({ color: d.id })
    }));
    const kinds = [
      { id: 'habit', title: 'Habit — just the X', desc: 'Do the minimum and mark the day. Nothing to plan. Good for meditation, reading or exercise.' },
      { id: 'project', title: 'Project — X plus daily tasks', desc: 'Plan tasks each evening, on your own or with Claude. Good for a game, the garden or a course.' }
    ].map((k) => ({
      title: k.title,
      desc: k.desc,
      checked: s.kind === k.id,
      ring: s.kind === k.id ? cur.color : '#2A2E34',
      bg: s.kind === k.id ? cur.bg : '#1C1F23',
      accent: cur.color,
      pick: () => this.setState({ kind: k.id })
    }));
    const starts = [
      { id: 'today', label: 'Today' },
      { id: 'tomorrow', label: 'Tomorrow' }
    ].map((o) => ({
      label: o.label,
      checked: s.start === o.id,
      ring: s.start === o.id ? cur.color : '#2A2E34',
      accent: cur.color,
      pick: () => this.setState({ start: o.id })
    }));
    const preview = [];
    for (let i = 1; i <= 49; i++) preview.push({ first: i === 1, rest: i !== 1, accent: cur.color });
    const name = (s.name || '').trim();
    const min = (s.min || '').trim();
    return {
      name: s.name,
      min: s.min,
      kinds: kinds,
      colors: colors,
      starts: starts,
      preview: preview,
      accent: cur.color,
      ink: cur.ink,
      displayName: name || 'Untitled',
      kindLine: s.kind === 'habit' ? 'Habit · no evening planning' : 'Project · planned each evening',
      minLine: min ? 'Minimum: ' + min : 'Set a minimum',
      startLine: s.start === 'today' ? 'starts today' : 'starts tomorrow',
      createLabel: s.kind === 'habit' ? 'Create habit' : 'Create project',
      onName: (e) => this.setState({ name: e.target.value }),
      onMin: (e) => this.setState({ min: e.target.value })
    };
  }
}
</script>
</body>
</html>
