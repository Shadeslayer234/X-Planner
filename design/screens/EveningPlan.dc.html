<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X Planner — Plan tomorrow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E0F11}
a{color:#F0B445}a:hover{color:#F6C76B}
input::placeholder{color:#80868E}
</style>
</helmet>
<div style="width: 440px; height: 960px; box-sizing: border-box; background: #141619; color: #E9EAEC; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; border: 1px solid #2A2E34; border-radius: 12px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 20px; border-bottom: 1px solid #22262B">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A0A6AD">EVENING PLANNING</div>
    <a href="Main.dc.html" aria-label="Close" title="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A0A6AD; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </a>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 22px 16px 20px">

    <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 8px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Plan Friday</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A0A6AD">23 Oct 2026</div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A0A6AD; padding-bottom: 2px">{{summary}}</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; background: #1C1F23; border: 1px solid {{g.frame}}; border-radius: 10px">
          <button onClick="{{g.toggleOpen}}" aria-expanded="{{g.expanded}}" style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: transparent; border: 0; color: #E9EAEC; font-family: 'IBM Plex Sans', sans-serif; text-align: left; cursor: pointer">
            <span style="width: 10px; height: 10px; flex: none; border-radius: 5px; background: {{g.color}}"></span>
            <span style="flex: 1; font-size: 15px; font-weight: 600">{{g.name}}</span>
            <sc-if value="{{g.planned}}" hint-placeholder-val="{{true}}">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A0A6AD">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{g.color}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
                {{g.statusText}}
              </span>
            </sc-if>
            <sc-if value="{{g.unplanned}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 12px; color: #E9EAEC">Not planned</span>
            </sc-if>
            <sc-if value="{{g.expanded}}" hint-placeholder-val="{{false}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0A6AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
            </sc-if>
            <sc-if value="{{g.collapsed}}" hint-placeholder-val="{{true}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0A6AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </sc-if>
          </button>

          <sc-if value="{{g.expanded}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 18px; padding: 4px 14px 16px; border-top: 1px solid #2A2E34">

              <sc-if value="{{g.hasLeftover}}" hint-placeholder-val="{{true}}">
                <div style="display: flex; flex-direction: column; padding-top: 10px">
                  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px">
                    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #A0A6AD">LEFT FROM TODAY</div>
                    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A0A6AD">{{g.doneLine}}</div>
                  </div>
                  <sc-for list="{{g.leftover}}" as="r" hint-placeholder-count="2">
                    <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #262A2F; cursor: pointer">
                      <input type="checkbox" checked="{{r.carried}}" onChange="{{r.toggle}}" style="width: 18px; height: 18px; margin: 0; flex: none; accent-color: {{r.color}}">
                      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
                        <span style="font-size: 14px">{{r.text}}</span>
                        <span style="font-size: 12px; color: #A0A6AD">Carry over to Friday</span>
                      </span>
                    </label>
                  </sc-for>
                </div>
              </sc-if>

              <div style="display: flex; flex-direction: column; padding-top: 6px">
                <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #A0A6AD; margin-bottom: 2px">FRIDAY</div>
                <sc-for list="{{g.tomorrow}}" as="t" hint-placeholder-count="2">
                  <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid #262A2F">
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A0A6AD; width: 18px">{{t.num}}</span>
                    <span style="flex: 1; min-width: 0; font-size: 14px">{{t.text}}</span>
                    <button aria-label="Remove task" onClick="{{t.remove}}" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #A0A6AD; cursor: pointer">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                    </button>
                  </div>
                </sc-for>
                <sc-if value="{{g.empty}}" hint-placeholder-val="{{false}}">
                  <div style="font-size: 13px; color: #A0A6AD; padding: 10px 0">Nothing planned yet.</div>
                </sc-if>
                <div style="display: flex; gap: 8px; margin-top: 10px">
                  <input type="text" aria-label="{{g.inputLabel}}" placeholder="Add a task" value="{{g.draft}}" onChange="{{g.onDraft}}" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; background: #141619; border: 1px solid #2A2E34; border-radius: 8px; color: #E9EAEC; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px">
                  <button aria-label="Add task" onClick="{{g.add}}" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: #141619; border: 1px solid #2A2E34; border-radius: 8px; color: #E9EAEC; cursor: pointer">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                  </button>
                </div>
              </div>

              <button style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; border: 1px solid #3A3F46; border-radius: 8px; color: #E9EAEC; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                {{g.claudeLabel}}
              </button>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; padding: 0 8px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #A0A6AD; margin-bottom: 2px">HABITS · NOTHING TO PLAN</div>
      <sc-for list="{{habits}}" as="h" hint-placeholder-count="1">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #1F2227">
          <span style="width: 8px; height: 8px; flex: none; border-radius: 4px; background: {{h.color}}"></span>
          <span style="flex: 1; font-size: 14px">{{h.name}}</span>
          <span style="font-size: 12px; color: #A0A6AD">{{h.status}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; gap: 10px; padding: 14px 16px 16px; border-top: 1px solid #22262B">
    <a href="Main.dc.html" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #2A2E34; color: #E9EAEC; font-size: 14px; font-weight: 500; text-decoration: none">Remind me in 30 min</a>
    <a href="Main.dc.html" style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #E9EAEC; color: #141619; font-size: 14px; font-weight: 600; text-decoration: none">Save plan</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":960}}'>
class Component extends DCLogic {
  state = {
    open: 'pg',
    drafts: {},
    nextId: 100,
    carry: { 2: true, 3: true, 12: true, 21: false },
    extra: { pg: [{ id: 50, text: 'Add sound to the throw ability' }], gd: [], un: [] }
  };

  renderVals() {
    const s = this.state;
    const projects = [
      { id: 'pg', name: 'Poltergeist', color: '#F0B445', today: [
        { id: 1, text: 'Prototype the object-throw ability', done: true },
        { id: 2, text: 'Fix the door interaction bug', done: false },
        { id: 3, text: 'Record a 2-minute devlog clip', done: false }
      ] },
      { id: 'gd', name: 'Garden', color: '#7CC48A', today: [
        { id: 11, text: 'Water the chili seedlings', done: true },
        { id: 12, text: 'Fill two grow bags with soil', done: false }
      ] },
      { id: 'un', name: 'Unity pathway', color: '#7FB0E0', today: [
        { id: 21, text: 'Finish the next pathway lesson', done: false }
      ] }
    ];

    const setCarry = (id, val) => {
      const next = Object.assign({}, this.state.carry);
      next[id] = val;
      this.setState({ carry: next });
    };

    let plannedCount = 0;
    const groups = projects.map((p) => {
      const leftoverRaw = p.today.filter((t) => !t.done);
      const doneCount = p.today.length - leftoverRaw.length;
      const leftover = leftoverRaw.map((t) => ({
        text: t.text,
        color: p.color,
        carried: !!s.carry[t.id],
        toggle: () => setCarry(t.id, !this.state.carry[t.id])
      }));
      const carried = leftoverRaw
        .filter((t) => s.carry[t.id])
        .map((t) => ({ text: t.text, remove: () => setCarry(t.id, false) }));
      const added = (s.extra[p.id] || []).map((t) => ({
        text: t.text,
        remove: () => {
          const ex = Object.assign({}, this.state.extra);
          ex[p.id] = (ex[p.id] || []).filter((x) => x.id !== t.id);
          this.setState({ extra: ex });
        }
      }));
      const tomorrow = carried.concat(added).map((t, i) => Object.assign({ num: String(i + 1).padStart(2, '0') }, t));
      const expanded = s.open === p.id;
      if (tomorrow.length > 0) plannedCount++;
      return {
        name: p.name,
        color: p.color,
        frame: expanded ? '#3A3F46' : '#2A2E34',
        expanded: expanded,
        collapsed: !expanded,
        planned: tomorrow.length > 0,
        unplanned: tomorrow.length === 0,
        statusText: tomorrow.length + (tomorrow.length === 1 ? ' task' : ' tasks'),
        hasLeftover: leftover.length > 0,
        leftover: leftover,
        doneLine: doneCount + ' done today',
        tomorrow: tomorrow,
        empty: tomorrow.length === 0,
        inputLabel: 'New task for ' + p.name,
        claudeLabel: 'Plan ' + p.name + ' with Claude',
        draft: s.drafts[p.id] || '',
        onDraft: (e) => {
          const d = Object.assign({}, this.state.drafts);
          d[p.id] = e.target.value;
          this.setState({ drafts: d });
        },
        add: () => {
          const text = (this.state.drafts[p.id] || '').trim();
          if (!text) return;
          const ex = Object.assign({}, this.state.extra);
          ex[p.id] = (ex[p.id] || []).concat([{ id: this.state.nextId, text: text }]);
          const d = Object.assign({}, this.state.drafts);
          d[p.id] = '';
          this.setState({ extra: ex, drafts: d, nextId: this.state.nextId + 1 });
        },
        toggleOpen: () => this.setState({ open: this.state.open === p.id ? '' : p.id })
      };
    });

    return {
      groups: groups,
      summary: plannedCount + ' of ' + projects.length + ' planned',
      habits: [{ name: 'Meditation', color: '#E58FA0', status: "Today's X not marked yet" }]
    };
  }
}
</script>
</body>
</html>
